<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة الإقبال التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0A5C4D; --bg: #F8F9FA; --text: #2D3748; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; border: 1px solid #CBD5E0; border-radius: 8px; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #063C32; }
        .msg { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #E53E3E; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" name="email" required placeholder="example@domain.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" name="password" required placeholder="********">
            </div>
            <button type="submit" id="submitBtn">دخول</button>
            <div id="errorMsg" class="msg"></div>
        </form>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbyw3Se7_OG2YotprOoe7NZ_wZioaUemueC2j9IXp7f4GztS0mQER7JC-kzDCinN-st6/exec";

        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            errorMsg.textContent = "جاري التحقق وتسجيل الدخول...";
            submitBtn.disabled = true;

            const email = encodeURIComponent(form.email.value.trim());
            const password = encodeURIComponent(form.password.value.trim());
            const url = `${scriptURL}?email=${email}&password=${password}`;

            fetch(url, { method: 'GET' })
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = "dashboard.html";
                } else {
                    errorMsg.textContent = result.message || "البريد الإلكتروني أو كلمة المرور غير صحيحة";
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                errorMsg.textContent = "تعذر الاتصال بالسيرفر: " + error.message;
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
