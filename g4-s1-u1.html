<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الوحدة الأولى — الصف الرابع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Tajawal', sans-serif; background: #FBF8F2; padding: 20px; text-align: center; }
  .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  .back-link { display: block; margin-bottom: 20px; color: #0F5C52; font-weight: bold; }
  
  /* مشغل الفيديو المدمج */
  .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin: 20px 0; border-radius: 8px; }
  .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  
  /* زر الشرح الكتابي */
  .btn-pdf { display: block; background: #0F5C52; color: white; padding: 15px; margin: 20px 0; border-radius: 8px; font-weight: bold; text-decoration: none; }
  
  /* الاختبار المدمج */
  .quiz-container { margin-top: 40px; }
  .quiz-container iframe { width: 100%; height: 800px; border: 1px solid #ddd; border-radius: 8px; }
</style>
</head>
<body>

<div class="container">
    <a href="grade4.html" class="back-link">← العودة لصفحات الصف الرابع</a>
    <h1>الوحدة الأولى: عنوان الوحدة هنا</h1>

    <!-- 1. الشرح المرئي (يوتيوب) -->
    <h3>الشرح المرئي</h3>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/ضع_كود_الفيديو_هنا" allowfullscreen></iframe>
    </div>

    <!-- 2. الشرح الكتابي -->
    <a href="رابط_ملف_الـPDF_على_جوجل_درايف" class="btn-pdf" target="_blank">تحميل أو عرض الشرح الكتابي (PDF)</a>

    <!-- 3. الاختبار المدمج (جوجل فورم) -->
    <div class="quiz-container">
        <h3>اختبار الوحدة التفاعلي</h3>
        <iframe src="https://docs.google.com/forms/d/e/ضع_رابط_نموذج_جوجل_هنا/viewform"></iframe>
    </div>
</div>

</body>
</html>
