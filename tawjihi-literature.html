<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتاب الأدب (التوجيهي) — منصة الإقبال التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --bg-color: #F8F9FA; --card-bg: #FFFFFF; --primary: #0A5C4D; --primary-dark: #063C32; --accent: #D4AF37; --text-main: #2D3748; --text-muted: #718096; --border-color: #E2E8F0; --shadow: 0 4px 15px rgba(10, 92, 77, 0.05); --transition: all 0.3s ease; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); color: #FFFFFF; text-align: center; padding: 40px 20px; border-bottom: 4px solid var(--accent); position: relative; }
        header h1 { font-family: 'El Messiri', sans-serif; font-size: 2.2rem; margin: 0 0 10px 0; }
        .back-link { position: absolute; top: 20px; right: 20px; color: #FFFFFF; background: rgba(255, 255, 255, 0.15); padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; transition: var(--transition); }
        .back-link:hover { background: rgba(255, 255, 255, 0.25); }
        .container { max-width: 850px; margin: 40px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .lesson-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px 25px; box-shadow: var(--shadow); transition: var(--transition); }
        .lesson-item:hover { border-color: var(--primary); box-shadow: 0 8px 25px rgba(10, 92, 77, 0.1); transform: translateY(-2px); }
        .lesson-title { font-family: 'El Messiri', sans-serif; color: var(--primary-dark); font-size: 1.25rem; margin: 0 0 15px 0; }
        .links-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .action-btn { background: var(--primary); color: white; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-family: 'Tajawal', sans-serif; font-weight: 500; font-size: 0.85rem; transition: var(--transition); display: inline-flex; align-items: center; gap: 5px; }
        .action-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .loading { text-align: center; font-size: 1.2rem; color: var(--text-muted); padding: 50px; }
        #mediaModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 900px; height: 80%; border-radius: 16px; position: relative; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .close-btn { position: absolute; top: 15px; left: 15px; background: #E53E3E; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 1rem; display: flex; align-items: center; justify-content: center; z-index: 10; transition: var(--transition); }
        .close-btn:hover { background: #C53030; }
    </style>
</head>
<body>
<header>
    <a href="index.html" class="back-link">← الرئيسية</a>
    <h1>كتاب الأدب</h1>
    <p>الثاني الثانوي — التوجيهي</p>
</header>
<div class="container" id="lessons-container">
    <div class="loading">جاري تحميل الدروس...</div>
</div>
<div id="mediaModal"><div class="modal-content"><button class="close-btn" onclick="closeModal()">✕</button><iframe id="mediaFrame" src="" width="100%" height="100%" frameborder="0" allowfullscreen></iframe></div></div>
<script>
    function openMedia(url) { document.getElementById('mediaFrame').src = url; document.getElementById('mediaModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('mediaModal').style.display = 'none'; document.getElementById('mediaFrame').src = ''; }
    
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQc-GebJO-z5OgDXvQlLDBkdE1XFHvL_B2c6GG4hee8G1E5tYs_Vpybki7B_9Byz_lemrtCd1mvaGHd/pub?output=csv';
    
    Papa.parse(sheetUrl, { download: true, header: true, complete: function(results) {
        const container = document.getElementById('lessons-container');
        container.innerHTML = '';
        let found = false;
        
        results.data.forEach(row => {
            // الفلترة هنا تعتمد على رمز كتاب الأدب 12أ
            if(row.grade && row.grade.trim() == "12أ") {
                found = true;
                let v = (row.video && row.video.trim() !== "") ? `<button onclick="openMedia('${row.video.trim()}')" class="action-btn">▶ الشرح</button>` : '';
                let p = (row.pdf && row.pdf.trim() !== "") ? `<button onclick="openMedia('${row.pdf.trim()}')" class="action-btn">📄 الكتاب</button>` : '';
                let w = (row.worksheets && row.worksheets.trim() !== "") ? `<button onclick="openMedia('${row.worksheets.trim()}')" class="action-btn" style="background: var(--accent); color: var(--primary-dark); font-weight: 700;">📝 أوراق عمل</button>` : '';
                let q = (row.quiz && row.quiz.trim() !== "") ? `<button onclick="openMedia('${row.quiz.trim()}')" class="action-btn">🧪 اختبار</button>` : '';
                
                container.innerHTML += `
                    <div class="lesson-item">
                        <h3 class="lesson-title">${row.title || 'درس بدون عنوان'}</h3>
                        <div class="links-row">${v}${p}${w}${q}</div>
                    </div>
                `;
            }
        });
        
        if(!found) {
            container.innerHTML = '<div class="loading">لا توجد دروس مضافة لهذا الكتاب حالياً.</div>';
        }
    }});
</script>
</body>
</html>
