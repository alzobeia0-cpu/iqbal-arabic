<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الذكية — منصة الإقبال التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8F9FA; --card-bg: #FFFFFF; --primary: #0A5C4D; --primary-dark: #063C32; 
            --accent: #D4AF37; --text-main: #2D3748; --border-color: #E2E8F0; --shadow: 0 10px 25px -5px rgba(10, 92, 77, 0.08);
        }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #FFFFFF; text-align: center; padding: 40px 20px; border-bottom: 5px solid var(--accent); position: relative; }
        header h1 { font-family: 'El Messiri', sans-serif; font-size: 2.2rem; margin: 0 0 10px 0; }
        .back-link { position: absolute; top: 20px; right: 20px; color: #FFFFFF; background: rgba(255, 255, 255, 0.15); padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; }
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .panel-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: var(--shadow); }
        .panel-card h2 { font-family: 'El Messiri', sans-serif; color: var(--primary-dark); margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--primary-dark); }
        input, select { width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(10, 92, 77, 0.1); }
        .btn { background: var(--primary); color: white; border: none; padding: 14px 25px; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn:hover { background: var(--primary-dark); }
        .status-msg { margin-top: 15px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-link">← الرئيسية</a>
    <h1>لوحة التحكم الذكية</h1>
    <p>إضافة الدروس وتحديث الموقع بضغطة زر</p>
</header>

<div class="container">
    <div class="panel-card">
        <h2>إضافة درس جديد للمنصة</h2>
        
        <div class="form-group">
            <label>الصف الدراسي:</label>
            <select id="gradeSelect">
                <option value="4">الصف الرابع</option>
                <option value="5">الصف الخامس</option>
                <option value="6">الصف السادس</option>
                <option value="7">الصف السابع</option>
                <option value="8">الصف الثامن</option>
                <option value="9">الصف التاسع</option>
                <option value="10">الصف العاشر</option>
                <option value="11">الأول الثانوي</option>
                <option value="12أ">كتاب الأدب - توجيهي</option>
            </select>
        </div>

        <div class="form-group">
            <label>عنوان الدرس:</label>
            <input type="text" id="lessonTitle" placeholder="مثال: درس المفعول به">
        </div>

        <div class="form-group">
            <label>رابط الشرح (فيديو):</label>
            <input type="text" id="videoLink" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>رابط الكتاب / الشرح (PDF):</label>
            <input type="text" id="pdfLink" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>رابط أوراق العمل:</label>
            <input type="text" id="worksheetsLink" placeholder="https://...">
        </div>

        <div class="form-group">
            <label>رابط الاختبار (Quiz):</label>
            <input type="text" id="quizLink" placeholder="https://...">
        </div>

        <button class="btn" onclick="sendData()">حفظ الدرس وإضافته للمنصة</button>
        <div id="statusMsg" class="status-msg"></div>
    </div>
</div>

<script>
    // تم دمج رابط تطبيق الويب الخاص بك هنا مباشرة
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxoZNyfmtKFvaKoVgSJEr_TjuYd1j2zcZ6a_mplwYY-6gvl3470h6zQSov3WjOAAM55/exec';

    function sendData() {
        const status = document.getElementById('statusMsg');
        const title = document.getElementById('lessonTitle').value.trim();
        
        if(!title) {
            alert('الرجاء كتابة عنوان الدرس.');
            return;
        }

        const formData = {
            grade: document.getElementById('gradeSelect').value,
            title: title,
            video: document.getElementById('videoLink').value.trim(),
            pdf: document.getElementById('pdfLink').value.trim(),
            worksheets: document.getElementById('worksheetsLink').value.trim(),
            quiz: document.getElementById('quizLink').value.trim()
        };

        status.style.display = 'block';
        status.style.color = '#D4AF37';
        status.innerText = 'جاري حفظ الدرس وإرساله للوحة البيانات...';

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(formData) })
        .then(response => {
            status.style.color = '#0A5C4D';
            status.innerText = 'تم إضافة الدرس بنجاح وسيعرض في المنصة فوراً!';
            // تفريغ الحقول بعد الإرسال الناجح
            document.getElementById('lessonTitle').value = '';
            document.getElementById('videoLink').value = '';
            document.getElementById('pdfLink').value = '';
            document.getElementById('worksheetsLink').value = '';
            document.getElementById('quizLink').value = '';
        })
        .catch(error => {
            status.style.color = '#E53E3E';
            status.innerText = 'حدث خطأ، تأكد من الرابط أو الاتصال بالإنترنت.';
        });
    }
</script>

</body>
</html>
