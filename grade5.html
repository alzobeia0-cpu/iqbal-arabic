<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصف الخامس الأساسي — منصة الإقبال التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #F8F9FA; --card-bg: #FFFFFF; --primary: #0A5C4D; --primary-dark: #063C32; --accent: #D4AF37; --text-main: #2D3748; --border-color: #E2E8F0; --shadow: 0 10px 25px -5px rgba(10, 92, 77, 0.08); }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #FFFFFF; text-align: center; padding: 40px 20px; border-bottom: 5px solid var(--accent); position: relative; }
        header h1 { font-family: 'El Messiri', sans-serif; font-size: 2.2rem; margin: 0 0 10px 0; }
        .back-link { position: absolute; top: 20px; right: 20px; color: #FFFFFF; background: rgba(255, 255, 255, 0.15); padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .unit-section { margin-bottom: 20px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
        .unit-header { background: var(--primary); color: white; padding: 18px 25px; font-family: 'El Messiri', sans-serif; font-size: 1.3rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .unit-header::after { content: '+'; font-size: 1.5rem; font-weight: bold; transition: transform 0.3s; }
        .unit-section.active .unit-header::after { transform: rotate(45deg); }
        .unit-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #FFF; }
        .unit-section.active .unit-content { max-height: 2000px; transition: max-height 0.6s ease-in; }
        .lesson-card { padding: 20px 25px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .lesson-title { font-weight: 700; font-size: 1.1rem; color: var(--primary-dark); flex: 1; min-width: 200px; }
        .lesson-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-link { padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; text-decoration: none; font-weight: 500; }
        .btn-video { background: #EBF8FF; color: #2B6CB0; border: 1px solid #BEE3F8; }
        .btn-pdf { background: #FFF5F5; color: #C53030; border: 1px solid #FED7D7; }
    </style>
</head>
<body>
<header>
    <a href="index.html" class="back-link">← الرئيسية</a>
    <h1>الصف الخامس الأساسي</h1>
    <p>اختر الوحدة الدراسية لعرض الدروس والمطالعة</p>
</header>
<div class="container">
    <div class="unit-section">
        <div class="unit-header" onclick="this.parentElement.classList.toggle('active')">اسم الوحدة الأولى للصف الخامس</div>
        <div class="unit-content">
            <div class="lesson-card">
                <div class="lesson-title">عنوان الدرس الأول</div>
                <div class="lesson-links">
                    <a href="#" target="_blank" class="btn-link btn-video">شرح الفيديو</a>
                    <a href="#" target="_blank" class="btn-link btn-pdf">الكتاب / PDF</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
