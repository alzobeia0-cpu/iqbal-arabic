<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصف الخامس — منصة الإقبال</title>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root {
            --ink:#1C2B2F;
            --paper:#FBF8F2;
            --teal:#0F5C52;
            --teal-deep:#0A3F38;
            --teal-light:#DCEEE8;
            --copper:#B5572E;
            --line:#E3DCC9;
            --white:#FFFFFF;
        }
        body { font-family: 'Tajawal', sans-serif; background: var(--paper); color: var(--ink); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header-box { text-align: center; margin-bottom: 30px; }
        .header-box h1 { font-family: 'El Messiri', sans-serif; color: var(--teal-deep); font-size: 2rem; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--copper); text-decoration: none; font-weight: bold; }
        
        .unit-card { 
            background: var(--white); 
            border: 1px solid var(--line); 
            border-radius: 12px; 
            padding: 25px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); 
        }
        .unit-card h3 { font-family: 'El Messiri', sans-serif; color: var(--teal); margin-top: 0; }
        .links-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .action-btn { background: var(--teal); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: bold; }
        .action-btn:hover { background: var(--teal-deep); }
        .loading { text-align: center; font-size: 1.1rem; color: #5A6B68; padding: 40px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← العودة للرئيسية</a>
    
    <div class="header-box">
        <h1>مادة اللغة العربية — الصف الخامس</h1>
        <p>يتم جلب المحتوى الخاص بالصف الخامس فقط من لوحة التحكم.</p>
    </div>

    <div id="units-container">
        <div class="loading">جاري تحميل المحتوى...</div>
    </div>
</div>

<script>
    // هذا الرابط هو الرابط العام لجدولك
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQc-GebJO-z5OgDXvQlLDBkdE1XFHvL_B2c6GG4hee8G1E5tYs_Vpybki7B_9Byz_lemrtCd1mvaGHd/pub?output=csv';

    Papa.parse(sheetUrl, {
        download: true,
        header: true,
        complete: function(results) {
            const container = document.getElementById('units-container');
            container.innerHTML = '';
            
            let found = false;
            // هنا الكود يبحث فقط عن الصف الذي يحمل الرقم "5"
            results.data.forEach(row => {
                if(row.grade && row.grade.trim() == "5") {
                    found = true;
                    container.innerHTML += `
                        <div class="unit-card">
                            <h3>الوحدة ${row.unit || ''}: ${row.title || ''}</h3>
                            <div class="links-row">
                                ${row.video ? `<a href="${row.video}" class="action-btn" target="_blank">الشرح المرئي</a>` : ''}
                                ${row.pdf ? `<a href="${row.pdf}" class="action-btn" target="_blank">الشرح الكتابي (PDF)</a>` : ''}
                                ${row.quiz ? `<a href="${row.quiz}" class="action-btn" target="_blank">الاختبار التفاعلي</a>` : ''}
                            </div>
                        </div>
                    `;
                }
            });

            if(!found) {
                container.innerHTML = '<p style="text-align:center;">لا توجد دروس مضافة للصف الخامس حالياً في لوحة التحكم.</p>';
            }
        }
    });
</script>

</body>
</html>
