<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة تحكم منصة الإقبال</title>
</head>
<body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="https://unpkg.com/decap-cms-locale-ar/dist/decap-cms-locale-ar.js"></script>
    <script>
        if (window.CMS && window.CMS.registerLocale) {
            CMS.registerLocale('ar', window.DecapCmsLocaleAr || window.NetlifyCmsLocaleAr);
        }
    </script>
</body>
</html>
