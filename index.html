<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الإقبال التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A5C4D;
            --accent: #276749;
            --bg: #F8F9FA;
            --text: #2D3748;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .auth-menu {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .auth-btn {
            color: white;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.3s;
        }
        .auth-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .dashboard-btn {
            background: #2F855A;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .welcome-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        .welcome-card h2 {
            color: var(--primary);
            margin-top: 0;
        }
        .btn-main {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn-main:hover {
            background: #063C32;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة الإقبال التعليمية</h1>
        <!-- زر تسجيل الدخول أو لوحة التحكم -->
        <div class="auth-menu">
            <a href="login.html" id="loginBtn" class="auth-btn">تسجيل الدخول</a>
            <a href="dashboard.html" id="dashboardBtn" class="auth-btn dashboard-btn" style="display: none;">لوحة التحكم</a>
        </div>
    </header>

    <div class="container">
        <div class="welcome-card">
            <h2>أهلاً بكم في منصة الإقبال التعليمية</h2>
            <p>وجهتك الشاملة لدروس وملخصات وأوراق عمل اللغة العربية للمرحلة الثانوية والأساسية.</p>
            <a href="dashboard.html" class="btn-main">استعرض لوحة التحكم والدروس</a>
        </div>
    </div>

    <script>
        // التحقق من حالة تسجيل الدخول لتغيير الزر تلقائياً
        const currentUser = JSON.parse(localStorage.getItem('user'));
        if (currentUser) {
            const loginBtn = document.getElementById('loginBtn');
            const dashBtn = document.getElementById('dashboardBtn');
            
            if(loginBtn) loginBtn.style.display = 'none';
            if(dashBtn) {
                dashBtn.style.display = 'inline-block';
                dashBtn.innerText = "أهلاً، " + currentUser.name;
            }
        }
    </script>

</body>
</html>
