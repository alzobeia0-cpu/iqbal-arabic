<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصف الرابع الأساسي — منصة الإقبال التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #F8F9FA; --card-bg: #FFFFFF; --primary: #0A5C4D; --primary-dark: #063C32; --accent: #D4AF37; --text-main: #2D3748; --border-color: #E2E8F0; --shadow: 0 10px 25px -5px rgba(10, 92, 77, 0.08); }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #FFFFFF; text-align: center; padding: 40px 20px; border-bottom: 5px solid var(--accent); position: relative; }
        header h1 { font-family: 'El Messiri', sans-serif; font-size: 2.2rem; margin: 0 0 10px 0; }
        .back-link { position: absolute; top: 20px; right: 20px; color: #FFFFFF; background: rgba(255, 255, 255, 0.15); padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; }
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .unit-section { margin-bottom: 20px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
        .unit-header { background: var(--primary); color: white; padding: 18px 25px; font-family: 'El Messiri', sans-serif; font-size: 1.3rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .unit-header:hover { background: var(--primary-dark); }
        .unit-header::after { content: '▼'; font-size: 1rem; transition: transform 0.3s ease; }
        .unit-section.active .unit-header::after { transform: rotate(180deg); }
        .unit-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #FFF; }
        .unit-section.active .unit-content { max-height: 3000px; transition: max-height 0.6s ease-in; }
        .lesson-card { padding: 20px 25px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .lesson-card:last-child { border-bottom: none; }
        .lesson-title { font-weight: 700; font-size: 1.1rem; color: var(--primary-dark); flex: 1; min-width: 200px; }
        .lesson-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-link { padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; text-decoration: none; font-weight: 500; }
        .btn-video { background: #EBF8FF; color: #2B6CB0; border: 1px solid #BEE3F8; }
        .btn-pdf { background: #FFF5F5; color: #C53030; border: 1px solid #FED7D7; }
        .btn-worksheets { background: #FEFCBF; color: #744210; border: 1px solid #FAF089; }
        .btn-quiz { background: #F0FFF4; color: #22543D; border: 1px solid #C6F6D5; }
        .loading { text-align: center; padding: 40px; font-size: 1.2rem; color: var(--primary); }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-link">← الرئيسية</a>
    <h1>الصف الرابع الأساسي</h1>
    <p>اختر الوحدة الدراسية لعرض الدروس والمطالعة</p>
</header>

<div class="container" id="unitsContainer">
    <div class="loading">جاري جلب الوحدات والدروس من جدول البيانات...</div>
</div>

<script>
    const sheetHTMLURL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQc-GebJO-z5OgDXvQlLDBkdE1XFHvL_B2c6GG4hee8G1E5tYs_Vpybki7B_9Byz_lemrtCd1mvaGHd/pubhtml';

    async function loadLessons() {
        const container = document.getElementById('unitsContainer');
        try {
            const response = await fetch(sheetHTMLURL);
            const htmlText = await response.text();
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            const rows = doc.querySelectorAll('tr');

            let gradeData = [];
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i].querySelectorAll('td');
                // في pubhtml يكون العمود الأول cols[0] هو رقم السطر، لذا نبدأ من cols[1]
                if (cols.length >= 7) {
                    const grade = cols[1] ? cols[1].textContent.trim() : '';
                    const unit = cols[2] ? cols[2].textContent.trim() : '';
                    const title = cols[3] ? cols[3].textContent.trim() : '';
                    const video = cols[4] ? cols[4].textContent.trim() : '';
                    const pdf = cols[5] ? cols[5].textContent.trim() : '';
                    const worksheets = cols[6] ? cols[6].textContent.trim() : '';
                    const quiz = cols[7] ? cols[7].textContent.trim() : '';

                    // التحقق مما إذا كان الصف يوافق الصف الرابع
                    if (grade == "4" || grade.includes("الرابع")) {
                        gradeData.push({ unit, title, video, pdf, worksheets, quiz });
                    }
                }
            }

            if (gradeData.length === 0) {
                container.innerHTML = '<div class="loading">لا توجد دروس مضافة لهذا الصف في الجدول حالياً. (تأكد أن العمود الأول في الجدول يكتب فيه رقم 4 أو الصف الرابع)</div>';
                return;
            }

            container.innerHTML = '';
            const grouped = {};
            gradeData.forEach(item => {
                if (!grouped[item.unit]) grouped[item.unit] = [];
                grouped[item.unit].push(item);
            });

            for (const [unitName, lessons] of Object.entries(grouped)) {
                const section = document.createElement('div');
                section.className = 'unit-section';

                let lessonsHTML = '';
                lessons.forEach(l => {
                    lessonsHTML += `
                        <div class="lesson-card">
                            <div class="lesson-title">${l.title}</div>
                            <div class="lesson-links">
                                ${l.video && l.video !== '#' ? `<a href="${l.video}" target="_blank" class="btn-link btn-video">شرح الفيديو</a>` : ''}
                                ${l.pdf && l.pdf !== '#' ? `<a href="${l.pdf}" target="_blank" class="btn-link btn-pdf">الكتاب / PDF</a>` : ''}
                                ${l.worksheets && l.worksheets !== '#' ? `<a href="${l.worksheets}" target="_blank" class="btn-link btn-worksheets">أوراق العمل</a>` : ''}
                                ${l.quiz && l.quiz !== '#' ? `<a href="${l.quiz}" target="_blank" class="btn-link btn-quiz">الاختبار</a>` : ''}
                            </div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="unit-header" onclick="this.parentElement.classList.toggle('active')">${unitName}</div>
                    <div class="unit-content">${lessonsHTML}</div>
                `;
                container.appendChild(section);
            }
        } catch (error) {
            container.innerHTML = '<div class="loading" style="color: #C53030;">حدث خطأ في قراءة الجدول، تأكد من الاتصال ومن نشر الجدول للعامة.</div>';
        }
    }

    loadLessons();
</script>

</body>
</html>
